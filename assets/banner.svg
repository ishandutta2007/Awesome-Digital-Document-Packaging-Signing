<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.35;
    }
    .flow-line {
      stroke: url(#neonCyan);
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      fill: none;
      animation: dashMove 12s linear infinite;
    }
    .orb-pulse {
      animation: floatOrb 6s ease-in-out infinite alternate;
    }
    .orb-pulse-rev {
      animation: floatOrbRev 8s ease-in-out infinite alternate;
    }
    .pill-float-1 {
      animation: pillFloat1 5s ease-in-out infinite alternate;
    }
    .pill-float-2 {
      animation: pillFloat2 6s ease-in-out infinite alternate;
    }
    .pill-float-3 {
      animation: pillFloat3 7s ease-in-out infinite alternate;
    }
    .badge-pop {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) scale(1); opacity: 0.25; }
      100% { transform: translateY(-30px) scale(1.15); opacity: 0.45; }
    }
    @keyframes floatOrbRev {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      100% { transform: translateY(25px) scale(0.9); opacity: 0.15; }
    }
    @keyframes pillFloat1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes pillFloat2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(7px); }
    }
    @keyframes pillFloat3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #818cf8); }
    }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #64748b;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Background Animated Atmospheric Glows -->
  <g class="orb-pulse">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <g class="orb-pulse-rev">
    <circle cx="1020" cy="300" r="160" fill="#818cf8" filter="url(#glow)" />
    <circle cx="900" cy="80" r="100" fill="#c084fc" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Ambient Grid pattern -->
  <g>
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Animated dynamic connection stream (in background) -->
  <path d="M 60 370 Q 300 390 550 360 T 1140 370" class="flow-line" />
  <path d="M 80 50 Q 400 30 750 60 T 1120 40" class="flow-line" opacity="0.6" />

  <!-- Central Visual Container Card (Frosted Glass) -->
  <rect x="70" y="45" width="1060" height="330" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Top Accent Bar -->
  <rect x="70" y="45" width="1060" height="4" fill="url(#neonCyan)" rx="2" />

  <!-- Left Icon: Document Envelope & Digital Seal -->
  <g transform="translate(120, 105)">
    <!-- Document Stack Base -->
    <rect x="14" y="14" width="76" height="96" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="7" y="7" width="76" height="96" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <!-- Front Document -->
    <rect x="0" y="0" width="76" height="96" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Doc Lines -->
    <line x1="14" y1="22" x2="48" y2="22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="14" y1="36" x2="62" y2="36" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="48" x2="56" y2="48" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="60" x2="42" y2="60" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Pen / Signature Swirl -->
    <path d="M 14 80 Q 28 66 40 76 T 62 74" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Verified Cryptographic Shield / Stamp -->
    <g transform="translate(48, 64)" class="badge-pop">
      <circle cx="16" cy="16" r="15" fill="url(#emeraldGrad)" />
      <!-- Checkmark -->
      <path d="M 10 16 L 14 20 L 22 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground Clear Text Header -->
  <g transform="translate(240, 115)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="195" height="26" rx="13" fill="#0369a1" fill-opacity="0.35" stroke="#0284c7" stroke-width="1" />
    <text x="12" y="17" class="pill-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="65" class="main-title">Digital Document Packaging &amp; Signing</text>

    <!-- Subtitle -->
    <text x="0" y="105" class="subtitle">E-Signature Platforms • Cryptographic Sealing • Tamper-Evident Audit Trails</text>

    <!-- Tagline description -->
    <text x="0" y="136" class="tagline">PAdES • eIDAS Compliant • Turnkey Open-Source Solutions &amp; Top Enterprise SaaS</text>
  </g>

  <!-- Dynamic Feature Badges / Pills (Placed safely at bottom row) -->
  <g transform="translate(120, 290)">
    <!-- Pill 1: PAdES / eIDAS -->
    <g class="pill-float-1" transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="24" class="pill-text">PAdES &amp; eIDAS</text>
    </g>

    <!-- Pill 2: Open Source Alternatives -->
    <g class="pill-float-2" transform="translate(190, 0)">
      <rect x="0" y="0" width="220" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#818cf8" />
      <text x="36" y="24" class="pill-text">DocuSeal • Documenso</text>
    </g>

    <!-- Pill 3: Audit Trail & Tamper Evidence -->
    <g class="pill-float-3" transform="translate(430, 0)">
      <rect x="0" y="0" width="220" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" class="pill-text">Tamper-Evident Audit</text>
    </g>

    <!-- Pill 4: Enterprise SaaS -->
    <g class="pill-float-1" transform="translate(670, 0)">
      <rect x="0" y="0" width="200" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#c084fc" />
      <text x="36" y="24" class="pill-text">Enterprise SaaS Metrics</text>
    </g>
  </g>
</svg>
